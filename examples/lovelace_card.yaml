# ==============================================================================
# Карточка умной кормушки для дашборда Home Assistant (Lovelace UI)
# Вставь этот код в режим редактирования карточки (Manual Card / Вручную)
# ==============================================================================

type: vertical-stack
cards:
  # 1. Заголовок устройства со статусом
  - type: custom:mushroom-template-card
    primary: Умная кормушка lion3
    secondary: >-
      Статус: {{ states('sensor.umnaya_kormushka_lion3_status_podkliucheniia') }} | 
      Сегодня выдано: {{ states('sensor.umnaya_kormushka_lion3_vydano_segodnia') }} порц.
    icon: mdi:paw
    icon_color: amber
    layout: horizontal

  # 2. Окно видеокамеры (живой поток в реальном времени)
  - type: picture-entity
    entity: camera.umnaya_kormushka_lion3_kamera
    name: Камера миски
    camera_view: live
    show_name: false
    show_state: false

  # 3. Управление кормлением: слайдер порций и большая кнопка спуска
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-number-card
        entity: number.umnaya_kormushka_lion3_razmer_portsii
        name: Размер порции
        icon: mdi:bowl-mix
        icon_color: deep-orange

      - type: custom:mushroom-template-card
        primary: Покормить
        secondary: Выдать корм сейчас
        icon: mdi:food-drumstick
        icon_color: green
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.umnaya_kormushka_lion3_vydat_korm

  # 4. Телеметрия и параметры (время последнего кормления, Wi-Fi и RTSP)
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.umnaya_kormushka_lion3_poslednee_kormlenie
        name: Покормлен
        icon: mdi:clock-check-outline
        icon_color: blue

      - type: custom:mushroom-entity-card
        entity: sensor.umnaya_kormushka_lion3_uroven_signala_wi_fi
        name: Wi-Fi
        icon: mdi:wifi
        icon_color: cyan

      - type: custom:mushroom-entity-card
        entity: switch.umnaya_kormushka_lion3_lokalnyi_rtsp_videopotok
        name: RTSP поток
        icon: mdi:video-wireless

